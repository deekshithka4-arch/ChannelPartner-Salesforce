<template>
    <lightning-quick-action-panel header="Upload Profile Picture">
        <div class="slds-p-around_medium slds-text-align_center">
            <template if:false={previewUrl}>
                <div class="slds-box slds-box_dashed slds-p-around_large">
                    <lightning-icon icon-name="doctype:image" size="large" class="slds-m-bottom_small"></lightning-icon>
                    <div class="slds-text-heading_small slds-m-bottom_x-small">Select a photo for this Employee</div>
                    <p class="slds-text-color_weak slds-m-bottom_medium">Supports JPG, PNG, GIF</p>
                    <input type="file" accept="image/*" class="slds-input" onchange={handleFileChange} />
                </div>
            </template>
            <template if:true={previewUrl}>
                <div class="slds-grid slds-grid_vertical slds-grid_align-center slds-grid_vertical-align-center">
                    <img src={previewUrl} alt="Preview" style="max-height: 160px; max-width: 160px; border-radius: 50%; object-fit: cover; border: 3px solid #0176d3; box-shadow: 0 4px 10px rgba(0,0,0,0.15);" />
                    <div class="slds-m-top_small slds-text-title_bold">{fileName}</div>
                    <lightning-button variant="base" label="Choose different file" onclick={handleResetFile} class="slds-m-top_x-small"></lightning-button>
                </div>
            </template>
        </div>
        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" label="Upload & Save" onclick={handleUpload} disabled={isSaveDisabled} class="slds-m-left_x-small"></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
