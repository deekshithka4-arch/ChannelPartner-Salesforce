<template>
    <lightning-quick-action-panel header="PJP Approval Decision">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </template>
        <div class="slds-p-around_medium">
            <template if:true={approvalInfo}>
                <div class="slds-box slds-box_small slds-theme_shade slds-m-bottom_medium">
                    <p class="slds-text-title_bold slds-m-bottom_x-small">PJP Details:</p>
                    <p class="slds-m-bottom_xx-small"><strong>PJP Name:</strong> {approvalInfo.pjpName}</p>
                    <p class="slds-m-bottom_xx-small"><strong>Status:</strong> <span class="slds-badge">{approvalInfo.pjpStatus}</span></p>
                    <p class="slds-m-bottom_xx-small"><strong>Employee:</strong> {approvalInfo.employeeName} (Status: <strong>{approvalInfo.employeeStatus}</strong>)</p>
                    <p class="slds-m-bottom_xx-small"><strong>Reporting Manager:</strong> {approvalInfo.reportingManagerName}</p>
                </div>
            </template>

            <template if:true={isAlreadyApproved}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <h2>This PJP has already been approved.</h2>
                </div>
            </template>

            <template if:false={isAlreadyApproved}>
                <lightning-radio-group name="decisionRadio"
                                       label="Approval Decision"
                                       options={decisionOptions}
                                       value={decision}
                                       onchange={handleDecisionChange}
                                       type="radio"
                                       class="slds-m-bottom_medium">
                </lightning-radio-group>

                <lightning-textarea label="Comments"
                                    value={comments}
                                    onchange={handleCommentsChange}
                                    class="slds-m-bottom_medium"
                                    placeholder="Enter comments (e.g. Approved)">
                </lightning-textarea>

                <div class="slds-box slds-theme_shade">
                    <template if:true={isApproveSelected}>
                        <p><strong>Note:</strong> Approving will set PJP status to <strong>Approved</strong>, update Employee status from <strong>Pending</strong> to <strong>Approved</strong>, and populate the Employee's PJP link.</p>
                    </template>
                    <template if:false={isApproveSelected}>
                        <p><strong>Note:</strong> Rejecting will set PJP status to <strong>Rejected</strong> and update Employee status to <strong>Rejected</strong>.</p>
                    </template>
                </div>
            </template>
        </div>
        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" label="Confirm Decision" onclick={handleConfirm} class="slds-m-left_x-small" disabled={isConfirmDisabled}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
