<template>
    <lightning-quick-action-panel header="Submit PJP for Approval">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </template>
        <div class="slds-p-around_medium">
            <template if:true={approvalInfo}>
                <div class="slds-box slds-box_small slds-theme_shade slds-m-bottom_medium">
                    <p class="slds-text-title_bold slds-m-bottom_x-small">Approval Routing Hierarchy:</p>
                    <p class="slds-m-bottom_xx-small"><strong>PJP:</strong> {approvalInfo.pjpName}</p>
                    <p class="slds-m-bottom_xx-small"><strong>Current Status:</strong> <span class="slds-badge">{approvalInfo.pjpStatus}</span></p>
                    <p class="slds-m-bottom_xx-small"><strong>Employee:</strong> {approvalInfo.employeeName} (Status: <strong>{approvalInfo.employeeStatus}</strong>)</p>
                    <p class="slds-m-bottom_xx-small"><strong>Reporting Manager:</strong> {approvalInfo.reportingManagerName}</p>
                    <p><strong>Approver User:</strong> <span class="slds-text-color_success"><strong>{approvalInfo.approverUserName}</strong></span></p>
                </div>
            </template>
            
            <template if:true={isAlreadyApproved}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <h2>This PJP has already been approved.</h2>
                </div>
            </template>

            <template if:true={isAlreadySubmitted}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <h2>This PJP is already submitted and pending approval. Use the Approve / Reject action or Approval History to approve.</h2>
                </div>
            </template>

            <template if:false={isAlreadyApproved}>
                <template if:false={isAlreadySubmitted}>
                    <p class="slds-m-bottom_medium">
                        Are you sure you want to submit this Permanent Journey Plan (PJP) for approval to the Reporting Manager?
                    </p>
                    <div class="slds-box slds-theme_shade">
                        <p><strong>Note:</strong> Once submitted, the status will change to <strong>Submitted</strong> and route to the Reporting Manager (<strong>{targetApproverText}</strong>). The employee will remain in <strong>Pending</strong> status until the Reporting Manager manually approves the PJP.</p>
                    </div>
                </template>
            </template>
        </div>
        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" label="Submit for Approval" onclick={handleSubmit} class="slds-m-left_x-small" disabled={isSubmitDisabled}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
