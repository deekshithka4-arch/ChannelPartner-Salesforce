<template>
    <div class="slds-card sfa-container slds-m-around_medium">
        <!-- Top Banner Header -->
        <div class="slds-page-header sfa-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-custom sfa-header-icon" title="SFANDMS">
                                <lightning-icon icon-name="standard:lightning_component" size="medium"></lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="SFANDMS Hub">
                                            SFANDMS &mdash; SFA &amp; Distribution Management Portal
                                        </span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">
                                Connected User: <strong>{currentUserName}</strong> ({currentUserEmail}) &bull; Active Org: <strong>AgentforceOrg</strong>
                            </p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh All Data" title="Refresh" onclick={refreshData} class="slds-m-right_x-small"></lightning-button-icon>
                        <lightning-button variant="brand" label="New Record" icon-name="utility:add" onclick={handleQuickAdd}></lightning-button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global KPI Metrics Bar -->
        <div class="slds-grid slds-wrap slds-m-around_medium sfa-kpi-bar">
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-blue">
                    <div class="stat-number">{employeeCount}</div>
                    <div class="stat-label">Employees ({pendingEmpCount} Pending)</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-purple">
                    <div class="stat-number">{geographyCount}</div>
                    <div class="stat-label">Geographies</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-teal">
                    <div class="stat-number">{beatCount}</div>
                    <div class="stat-label">Beats Defined</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-orange">
                    <div class="stat-number">{outletCount}</div>
                    <div class="stat-label">Outlets Registered</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-green">
                    <div class="stat-number">{distributorCount}</div>
                    <div class="stat-label">Distributors</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-blue">
                    <div class="stat-number">{primaryOrderCount}</div>
                    <div class="stat-label">Primary Orders ({pendingPoCount} DO Pending)</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-purple">
                    <div class="stat-number">{openTicketCount}</div>
                    <div class="stat-label">Open DMS Tickets</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-orange">
                    <div class="stat-number">{returnCount}</div>
                    <div class="stat-label">Primary Returns</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-teal">
                    <div class="stat-number">{distributorOfficerCount}</div>
                    <div class="stat-label">Distributor Officers</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-horizontal_x-small slds-m-bottom_small">
                <div class="slds-box slds-box_small sfa-stat-card stat-orange">
                    <div class="stat-number">{pendingPrimaryApprovalCount}</div>
                    <div class="stat-label">DO Approvals Pending</div>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-p-around_large slds-text-align_center">
                <lightning-spinner alternative-text="Loading SFANDMS data..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Main Tabset -->
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-tabset selected-tab-value={activeTab} onselect={handleTabSelect}>
                
                <!-- TAB 1: EMPLOYEES -->
                <lightning-tab label="Employees" value="employees" icon-name="standard:people">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input type="search" placeholder="Search employees by name, Aadhaar, PAN..." value={empSearchKey} onchange={handleEmpSearch}></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Add Employee" icon-name="utility:add" onclick={openNewEmployeeModal}></lightning-button>
                        </div>
                    </div>

                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate">Employee Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Aadhaar (12 Digits)</div></th>
                                    <th scope="col"><div class="slds-truncate">PAN (10 Chars)</div></th>
                                    <th scope="col"><div class="slds-truncate">Phone</div></th>
                                    <th scope="col"><div class="slds-truncate">Emergency Contact</div></th>
                                    <th scope="col"><div class="slds-truncate">Geography</div></th>
                                    <th scope="col"><div class="slds-truncate">Hierarchy</div></th>
                                    <th scope="col"><div class="slds-truncate">Level &amp; Channel (L1-L8)</div></th>
                                    <th scope="col"><div class="slds-truncate">Reporting Manager</div></th>
                                    <th scope="col"><div class="slds-truncate">Lead Owner</div></th>
                                    <th scope="col"><div class="slds-truncate">Distributor</div></th>
                                    <th scope="col"><div class="slds-truncate">PJP</div></th>
                                    <th scope="col"><div class="slds-truncate">Status</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredEmployees} for:item="emp">
                                    <tr key={emp.Id}>
                                        <td data-label="Employee Name">
                                            <strong>{emp.Name}</strong>
                                        </td>
                                        <td data-label="Aadhaar Number">
                                            <code>{emp.Aadhaar_Number__c}</code>
                                        </td>
                                        <td data-label="PAN Number">
                                            <code>{emp.PAN_Number__c}</code>
                                        </td>
                                        <td data-label="Phone">{emp.Phone_Number__c}</td>
                                        <td data-label="Emergency Contact">{emp.Emergency_Contact__c}</td>
                                        <td data-label="Geography">{emp.geoName}</td>
                                        <td data-label="Hierarchy">{emp.Hierarchy__c}</td>
                                        <td data-label="Level & Channel">
                                            <span class="slds-badge slds-badge_lightest slds-m-right_xx-small">{emp.Employee_Level__c}</span>
                                            <span class={emp.channelBadgeClass}>{emp.Access_Channel__c}</span>
                                        </td>
                                        <td data-label="Manager"><span class="slds-badge slds-badge_lightest">{emp.mgrName}</span></td>
                                        <td data-label="Lead Owner"><span class="slds-badge slds-badge_lightest">{emp.leadOwnerName}</span></td>
                                        <td data-label="Distributor">{emp.Distributor__c}</td>
                                        <td data-label="PJP">{emp.pjpName}</td>
                                        <td data-label="Status">
                                            <span class={emp.statusBadgeClass}>{emp.Status__c}</span>
                                        </td>
                                    </tr>
                                </template>
                                <template if:false={hasEmployees}>
                                    <tr>
                                        <td colspan="12" class="slds-text-align_center slds-p-around_medium">
                                            <em>No employees found. Click "Add Employee" to create one.</em>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </lightning-tab>

                <!-- TAB 2: GEOGRAPHY -->
                <lightning-tab label="Geography" value="geography" icon-name="standard:address">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input type="search" placeholder="Search geography by name, state, district..." value={geoSearchKey} onchange={handleGeoSearch}></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Add Geography" icon-name="utility:add" onclick={openNewGeoModal}></lightning-button>
                        </div>
                    </div>

                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate">Geography Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Nation</div></th>
                                    <th scope="col"><div class="slds-truncate">State</div></th>
                                    <th scope="col"><div class="slds-truncate">District</div></th>
                                    <th scope="col"><div class="slds-truncate">Town</div></th>
                                    <th scope="col"><div class="slds-truncate">Municipal</div></th>
                                    <th scope="col"><div class="slds-truncate">Village</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredGeographies} for:item="geo">
                                    <tr key={geo.Id}>
                                        <td data-label="Geography Name"><strong>{geo.Name}</strong></td>
                                        <td data-label="Nation">{geo.Nation__c}</td>
                                        <td data-label="State">{geo.State__c}</td>
                                        <td data-label="District">{geo.District__c}</td>
                                        <td data-label="Town">{geo.Town__c}</td>
                                        <td data-label="Municipal">{geo.Municipal__c}</td>
                                        <td data-label="Village">{geo.Village__c}</td>
                                    </tr>
                                </template>
                                <template if:false={hasGeographies}>
                                    <tr>
                                        <td colspan="7" class="slds-text-align_center slds-p-around_medium">
                                            <em>No geography records found. Click "Add Geography" to create.</em>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </lightning-tab>

                <!-- TAB 3: BEAT -->
                <lightning-tab label="Beats" value="beats" icon-name="standard:location">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input type="search" placeholder="Search beats by name, ID, assigned rep..." value={beatSearchKey} onchange={handleBeatSearch}></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Add Beat" icon-name="utility:add" onclick={openNewBeatModal}></lightning-button>
                        </div>
                    </div>

                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate">Beat ID</div></th>
                                    <th scope="col"><div class="slds-truncate">Beat Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Beat Assigned To</div></th>
                                    <th scope="col"><div class="slds-truncate">Distributor</div></th>
                                    <th scope="col"><div class="slds-truncate">Geography</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredBeats} for:item="bt">
                                    <tr key={bt.Id}>
                                        <td data-label="Beat ID"><code>{bt.Beat_ID__c}</code></td>
                                        <td data-label="Beat Name"><strong>{bt.Name}</strong></td>
                                        <td data-label="Beat Assigned To">
                                            <span class="slds-badge slds-badge_lightest">{bt.empName}</span>
                                        </td>
                                        <td data-label="Distributor">{bt.Distributor__c}</td>
                                        <td data-label="Geography">{bt.geoName}</td>
                                    </tr>
                                </template>
                                <template if:false={hasBeats}>
                                    <tr>
                                        <td colspan="5" class="slds-text-align_center slds-p-around_medium">
                                            <em>No beats found. Click "Add Beat" to create.</em>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </lightning-tab>

                <!-- TAB 4: OUTLETS -->
                <lightning-tab label="Outlets" value="outlets" icon-name="standard:store">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input type="search" placeholder="Search outlets by name, owner, beat..." value={outletSearchKey} onchange={handleOutletSearch}></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Add Outlet" icon-name="utility:add" onclick={openNewOutletModal}></lightning-button>
                        </div>
                    </div>

                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate">Outlet Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Owner Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Contact No.</div></th>
                                    <th scope="col"><div class="slds-truncate">Email</div></th>
                                    <th scope="col"><div class="slds-truncate">Aadhaar</div></th>
                                    <th scope="col"><div class="slds-truncate">PAN</div></th>
                                    <th scope="col"><div class="slds-truncate">Geo Location</div></th>
                                    <th scope="col"><div class="slds-truncate">Geography</div></th>
                                    <th scope="col"><div class="slds-truncate">Beat</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredOutlets} for:item="out">
                                    <tr key={out.Id}>
                                        <td data-label="Outlet Name"><strong>{out.Name}</strong></td>
                                        <td data-label="Owner Name">{out.Outlet_Owner_Name__c}</td>
                                        <td data-label="Contact">{out.Contact_No__c}</td>
                                        <td data-label="Email">{out.Email__c}</td>
                                        <td data-label="Aadhaar"><code>{out.Aadhaar__c}</code></td>
                                        <td data-label="PAN"><code>{out.PAN__c}</code></td>
                                        <td data-label="Geo Location">{out.locationDisplay}</td>
                                        <td data-label="Geography">{out.geoName}</td>
                                        <td data-label="Beat"><span class="slds-badge slds-badge_lightest">{out.beatName}</span></td>
                                    </tr>
                                </template>
                                <template if:false={hasOutlets}>
                                    <tr>
                                        <td colspan="9" class="slds-text-align_center slds-p-around_medium">
                                            <em>No outlets registered. Click "Add Outlet" to create.</em>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </lightning-tab>

                <!-- TAB 5: PJP & APPROVALS -->
                <lightning-tab label="PJP & Approvals" value="pjp" icon-name="standard:approval">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input type="search" placeholder="Search PJP by name, employee, lead owner..." value={pjpSearchKey} onchange={handlePjpSearch}></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Add PJP" icon-name="utility:add" onclick={openNewPjpModal}></lightning-button>
                        </div>
                    </div>

                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate">PJP Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Employee</div></th>
                                    <th scope="col"><div class="slds-truncate">Lead Owner (Approver)</div></th>
                                    <th scope="col"><div class="slds-truncate">PJP Status</div></th>
                                    <th scope="col"><div class="slds-truncate">Employee Status</div></th>
                                    <th scope="col"><div class="slds-truncate">Approval Actions</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredPjps} for:item="p">
                                    <tr key={p.Id}>
                                        <td data-label="PJP Name"><strong>{p.Name}</strong></td>
                                        <td data-label="Employee">{p.empName}</td>
                                        <td data-label="Lead Owner">{p.ownerName}</td>
                                        <td data-label="PJP Status">
                                            <span class={p.statusBadgeClass}>{p.Status__c}</span>
                                        </td>
                                        <td data-label="Employee Status">
                                            <span class={p.empStatusBadgeClass}>{p.empStatus}</span>
                                        </td>
                                        <td data-label="Actions">
                                            <template if:true={p.isDraft}>
                                                <lightning-button variant="brand-outline" label="Submit for Approval" icon-name="utility:send" size="small" data-id={p.Id} onclick={handleSubmitPjpAction}></lightning-button>
                                            </template>
                                            <template if:true={p.isSubmitted}>
                                                <div class="slds-button-group">
                                                    <lightning-button variant="success" label="Approve" icon-name="utility:check" size="small" data-id={p.Id} onclick={handleOpenApproveModal}></lightning-button>
                                                    <lightning-button variant="destructive" label="Reject" icon-name="utility:close" size="small" data-id={p.Id} onclick={handleOpenRejectModal} class="slds-m-left_xx-small"></lightning-button>
                                                </div>
                                            </template>
                                            <template if:true={p.isApproved}>
                                                <span class="slds-badge slds-theme_success">Approved ✓</span>
                                            </template>
                                            <template if:true={p.isRejected}>
                                                <span class="slds-badge slds-theme_error">Rejected ✗</span>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                                <template if:false={hasPjps}>
                                    <tr>
                                        <td colspan="6" class="slds-text-align_center slds-p-around_medium">
                                            <em>No PJPs defined. Click "Add PJP" to assign journey plan.</em>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </lightning-tab>

                <!-- TAB 6: DISTRIBUTORS -->
                <lightning-tab label="Distributors" value="distributors" icon-name="standard:account">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input type="search" placeholder="Search distributors by name, code, contact..." value={distSearchKey} onchange={handleDistSearch}></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Add Distributor" icon-name="utility:add" onclick={openNewDistModal}></lightning-button>
                        </div>
                    </div>

                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate">Distributor Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Code</div></th>
                                    <th scope="col"><div class="slds-truncate">Distributor Owner</div></th>
                                    <th scope="col"><div class="slds-truncate">Mobile &amp; Email</div></th>
                                    <th scope="col"><div class="slds-truncate">City &amp; State</div></th>
                                    <th scope="col"><div class="slds-truncate">Max Outlets</div></th>
                                    <th scope="col"><div class="slds-truncate">DMS Portal Status</div></th>
                                    <th scope="col"><div class="slds-truncate">Action</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template if:true={hasDistributors}>
                                    <template for:each={filteredDistributors} for:item="d">
                                        <tr key={d.Id} class="slds-hint-parent">
                                            <td><strong>{d.Name}</strong></td>
                                            <td>{d.Distributor_Code__c}</td>
                                            <td>
                                                <div><strong>{d.ownerNameDisplay}</strong></div>
                                                <div class="slds-text-body_small slds-text-color_weak">{d.Contact_Person__c}</div>
                                            </td>
                                            <td>
                                                <div>{d.mobileDisplay}</div>
                                                <div class="slds-text-body_small slds-text-color_weak">{d.Email__c}</div>
                                            </td>
                                            <td>{d.City__c}, {d.State__c}</td>
                                            <td>{d.Max_Outlets__c} Outlets</td>
                                            <td>
                                                <template if:true={d.DMS_Portal_Enabled__c}>
                                                    <span class="slds-badge slds-theme_success">Portal Enabled</span>
                                                </template>
                                                <template if:false={d.DMS_Portal_Enabled__c}>
                                                    <span class="slds-badge slds-theme_error">Disabled</span>
                                                </template>
                                            </td>
                                            <td>

                                                </template>
                                                <template if:true={r.isRejected}>

                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-top_small">
                                        <div class="slds-box slds-box_x-small slds-theme_shade" style="background: #eef4ff; border-color: #0176d3;">
                                            <div class="slds-text-title_caps slds-text-color_weak">Total Consignment Value</div>
                                            <div class="slds-text-heading_medium" style="font-weight: 800; color: #014486;">₹{selectedApproval.Total_Amount__c}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- PRODUCT ITEMIZED BREAKDOWN -->
                        <div class="slds-section slds-is-open slds-m-bottom_medium">
                            <h3 class="slds-section__title slds-theme_offline">
                                <span class="slds-truncate slds-p-horizontal_small" title="Product Itemized Breakdown (5 SKU Lines)" style="font-weight: 700;">Product Itemized Breakdown</span>
                            </h3>
                            <div class="slds-section__content slds-p-horizontal_small">
                                <template if:true={selectedApproval.hasItems}>
                                    <div class="slds-scrollable_x">
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                            <thead>
                                                <tr class="slds-line-height_reset">
                                                    <th scope="col"><div class="slds-truncate">#</div></th>
                                                    <th scope="col"><div class="slds-truncate">Product Name</div></th>
                                                    <th scope="col"><div class="slds-truncate">SKU Code</div></th>
                                                    <th scope="col"><div class="slds-truncate">Paid Cases</div></th>
                                                    <th scope="col"><div class="slds-truncate">Free Cases</div></th>
                                                    <th scope="col"><div class="slds-truncate">Total Cases</div></th>
                                                    <th scope="col"><div class="slds-truncate">Pcs/Case</div></th>
                                                    <th scope="col"><div class="slds-truncate">Total Pcs</div></th>
                                                    <th scope="col"><div class="slds-truncate">Rate/Case</div></th>
                                                    <th scope="col"><div class="slds-truncate">Taxable Base</div></th>
                                                    <th scope="col"><div class="slds-truncate">GST (18%)</div></th>
                                                    <th scope="col"><div class="slds-truncate">Line Total</div></th>
                                                    <th scope="col"><div class="slds-truncate">Barcode Reader / Code</div></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={selectedApproval.parsedItems} for:item="item" for:index="idx">
                                                    <tr key={item.sku} class="slds-hint-parent">
                                                        <td>{idx}</td>
                                                        <td><strong>{item.productName}</strong></td>
                                                        <td><span class="slds-badge slds-theme_shade">{item.sku}</span></td>
                                                        <td>{item.paidCases}</td>
                                                        <td style="color: #2e844a; font-weight: 600;">{item.freeCases}</td>
                                                        <td><strong>{item.totalCases}</strong></td>
                                                        <td>{item.piecesPerCase}</td>
                                                        <td>{item.totalPieces}</td>
                                                        <td>₹{item.ratePerCase}</td>
                                                        <td>₹{item.taxableAmount}</td>
                                                        <td>₹{item.gstAmount}</td>
                                                        <td><strong>₹{item.lineTotal}</strong></td>
                                                        <td>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="utility:scan" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                                                <span style="font-family: monospace; font-size: 0.8rem; background: #f3f3f3; padding: 2px 6px; border-radius: 4px; border: 1px dashed #bbb;">{item.barcode}</span>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <template if:false={selectedApproval.hasItems}>
                                    <div class="slds-box slds-box_small slds-theme_shade">
                                        <div class="slds-text-title_caps slds-m-bottom_xx-small">Items Summary</div>
                                        <p>{selectedApproval.Items_Summary__c}</p>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- REMARKS & DO REMARKS -->
                        <div class="slds-section slds-is-open">
                            <h3 class="slds-section__title slds-theme_offline">
                                <span class="slds-truncate slds-p-horizontal_small" title="Audit &amp; Remarks" style="font-weight: 700;">Audit &amp; Approval Remarks</span>
                            </h3>
                            <div class="slds-section__content slds-p-horizontal_small">
                                <div class="slds-grid slds-wrap slds-gutters">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                                        <div class="slds-box slds-box_x-small slds-theme_shade">
                                            <div class="slds-text-title_caps slds-text-color_weak">General Remarks</div>
                                            <div class="slds-m-top_xx-small">{selectedApproval.Remarks__c}</div>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                                        <div class="slds-box slds-box_x-small slds-theme_shade">
                                            <div class="slds-text-title_caps slds-text-color_weak">DO (Distribution Officer) Remarks</div>
                                            <div class="slds-m-top_xx-small">{selectedApproval.DO_Remarks__c}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={closeApprovalDetailModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
